name: medallion
version: "0.1.0"
config-version: 2
profile: medallion

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

# Layer = schema. Materializations follow dbt's and Databricks' guidance; see docs/materialization.md.
models:
  medallion:
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

# The calendar dim_date covers. end is exclusive.
vars:
  calendar_start: "2025-01-01"
  calendar_end: "2028-01-01"

# Seeds stand in for the loader in dev and CI. Prod reads what the loader lands.
# Everything lands as text, the way a file drop or Excel export arrives.
seeds:
  medallion:
    raw:
      +enabled: "{{ target.name != 'prod' }}"
      +schema: raw
      +quote_columns: true
      # Raw headers have spaces and '#'. Delta tables need column mapping to allow them.
      # Adapters that don't know tblproperties ignore it.
      +tblproperties:
        delta.columnMapping.mode: name
      # One text type per warehouse. Plain varchar is unbounded on DuckDB, Snowflake and
      # Postgres, but means varchar(1) on Fabric/SQL Server and varchar(256) on Redshift,
      # and doesn't exist on BigQuery or Databricks. Add your adapter here if it isn't listed.
      +column_types:
        "Store #": &text "{{ {'bigquery': 'string', 'databricks': 'string', 'spark': 'string', 'fabric': 'varchar(8000)', 'sqlserver': 'varchar(8000)', 'synapse': 'varchar(8000)', 'redshift': 'varchar(65535)'}.get(target.type, 'varchar') }}"
        "Store Name": *text
        "City": *text
        "State": *text
        "Region": *text
        "Sq Ft": *text
        "Opened On": *text
        "SKU": *text
        "Product Name": *text
        "Category": *text
        "Unit Cost": *text
        "List Price": *text
        "Sale Date": *text
        "Units Sold": *text
        "Gross Sales": *text
        "Discount Amt": *text
        "Count Date": *text
        "Units On Hand": *text

# Tests fail the build by default. Downgrade one at a time, on purpose.
data_tests:
  medallion:
    +severity: error
