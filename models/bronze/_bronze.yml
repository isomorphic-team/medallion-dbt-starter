version: 2

# Bronze tests check that the source still looks like what we built against.
# A failure here means the sender changed something. Fix the contract, not the data.
models:
  - name: bronze__stores
    columns:
      - name: store_number
        data_tests: [not_null, unique]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ['West', 'Midwest', 'South', 'Northeast']
  - name: bronze__products
    columns:
      - name: sku
        data_tests: [not_null, unique]
      - name: unit_cost
        data_tests: [not_null]
  - name: bronze__sales
    columns:
      - name: store_number
        data_tests: [not_null]
      - name: sku
        data_tests: [not_null]
      - name: sale_date
        data_tests: [not_null]
  - name: bronze__inventory
    columns:
      - name: store_number
        data_tests: [not_null]
      - name: sku
        data_tests: [not_null]
