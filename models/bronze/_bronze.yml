version: 2

# Bronze tests check that the source still looks like what we built against.
# A failure here means the sender changed something. Fix the contract, not the data.
models:
  - name: bronze__deals
    columns:
      - name: deal_id
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'closed']
  - name: bronze__stores
    columns:
      - name: store_number
        data_tests: [not_null]
      - name: deal_id
        data_tests: [not_null]
  - name: bronze__inventory
    columns:
      - name: sku
        data_tests: [not_null]
  - name: bronze__sales
    columns:
      - name: sale_date
        data_tests: [not_null]
